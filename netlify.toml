# Netlify 설정 (DEPLOY.md §3)
#
# 호스트에 요구하는 것은 둘뿐이다: **응답 헤더를 실제로 붙일 수 있을 것**과
# **SPA fallback이 돌 것**. 이 파일이 그 둘이다.
#
# ⚠️ **`_headers`·`_redirects`가 아니라 이 파일이다.** 그 둘은 배포 폴더(`dist`)
# 안에 있어야 하는데, 빌드가 `copyPublicDir: false`로 `public/`을 통째 복사하지
# 않고 **앱 셸 허용 목록만** 옮긴다 (vite.config.ts · COPYRIGHT.md §6). 그러니
# 그 길로 가려면 허용 목록과 앱 셸 대장(`tools/distribution/appShell.mjs`)까지
# 고쳐야 하고, 그러면 "배포물에 무엇이 들어가는가"를 재는 검사가 흐려진다.
# 뿌리에 있는 이 파일은 `dist`를 한 조각도 안 건드린다.
#
# ⚠️ **아래 헤더 값을 손으로 고치지 않는다.** 정본은
# `tools/distribution/csp.mjs`이고, 이 파일이 그것과 어긋나면
# `src/app/netlifyHeaders.test.ts`가 `pnpm check`에서 선다 — 배포한 뒤에
# `verify:deploy`로 알게 되는 것보다 앞이다.

[build]
  command = "pnpm build"
  publish = "dist"

  # ── 배포물이 안 바뀌면 안 굽는다 ───────────────────────────────────────────
  #
  # ⚠️ **빌드를 빠르게 만드는 것은 값이 0이다.** 실측으로 한 번이 31~40초인데
  # (네트리파이 배포 목록) 청구는 **분 단위로 올림**한다. `tsc -b` 19초를 통째로
  # 없애도 여전히 1분이다. 줄일 수 있는 것은 **횟수뿐이다.**
  #
  # 그리고 횟수에 새는 자리가 있었다 — 최근 커밋 60개 중 **22개(37%)가 `dist`에
  # 한 바이트도 안 간다.** 대부분 문서 한 파일짜리다(`docs/CODEMAP.md` 하나,
  # `docs/DEPLOY.md` 하나…). 문서는 배포물에 실릴 길이 아예 없다 —
  # `copyPublicDir: false`에 앱 셸 허용 목록이라 `dist`에서 0건이다.
  #
  # ⚠️ **그런데도 다시 구우면 배포물이 바뀐다.** 도장(`BUILD_ID`)이 `contract`
  # 청크에 박혀 있어서, 코드가 한 줄도 안 바뀐 재빌드에 **71개 중 16개**의
  # 이름·내용이 바뀐다(청크 15개 1,064.0kB · gzip 350.4kB · assets의 22%).
  # 아래 `/assets/*.js`에 1년 `immutable`을 걸어 두었으니 **다시 오는 사람이 그
  # 열다섯을 통째로 다시 받는다.** 빌드 분과 대역폭이 같이 샌다.
  #
  # **exit 0이면 건너뛴다.** `git diff --quiet`가 차이가 없을 때 0이라 뜻이 맞다.
  #
  # ⚠️ **빈 값을 먼저 막는다.** `$CACHED_COMMIT_REF`가 비면(첫 빌드·캐시 만료)
  # `git diff --quiet <sha> -- 경로`가 되어 **작업 트리와 견주게** 된다. 체크아웃한
  # 것이 바로 그 커밋이라 차이가 0으로 나오고, 그러면 **첫 빌드를 건너뛴다.**
  # 앞의 `[ -n ... ]` 둘이 그 자리를 막는다 — 하나라도 비면 0이 아닌 값이라 굽는다.
  #
  # ⚠️ **목록이 곧 「배포물의 재료」다.** 새 소스 뿌리를 만들면 여기 적어야 한다 —
  # 안 적으면 그 자리를 고쳐도 배포가 조용히 안 나간다. 그것을
  # `tools/distribution/netlifyHeaders.test.mjs`가 뿌리마다 확인한다.
  #
  # `tools/distribution`은 배포물을 안 바꾸지만 **빌드를 세울 수 있는 검사**라
  # (`boundary:pre`·`boundary:post`) 같이 넣는다.
  ignore = '[ -n "$CACHED_COMMIT_REF" ] && [ -n "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- src public index.html vite.config.ts tsconfig.json package.json pnpm-lock.yaml netlify.toml tools/distribution'

[build.environment]
  # 개발 기계와 같은 판. 빌드는 롬도 `AssetAssistant`도 필요 없다 —
  # 게임 자료는 배포물에 안 들어가고 사용자 브라우저가 만든다 (IMPORT.md §8)
  NODE_VERSION = "22"

# ── 응답 헤더 ────────────────────────────────────────────────────────────────
#
# `connect-src 'self' blob:`가 무전송 경계다 — 바깥 오리진이 없으니 사용자가
# 고른 롬 바이트가 나갈 곳이 없다. `frame-ancestors`는 **헤더에서만** 먹는다
# (meta에서는 무시된다). 그것이 이 파일이 필요한 이유이자, GitHub Pages를
# 못 쓰는 이유다.
[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob:; worker-src 'self'; font-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cross-Origin-Opener-Policy = "same-origin"
    # https일 때만 뜻이 있다. Netlify는 HTTPS로 준다
    Strict-Transport-Security = "max-age=31536000"

# ⚠️ **`Cross-Origin-Embedder-Policy`는 안 켠다.** `SharedArrayBuffer`를 안 쓰고,
# 켜면 blob:/data: 로딩 규칙이 까다로워져 OPFS 경로가 흔들린다 (DEPLOY.md §3)

# ── 이름에 해시가 붙은 것만 영구 캐시 ────────────────────────────────────────
#
# Netlify 기본값은 `public,max-age=0,must-revalidate`라 다시 오는 사람이
# 파일마다 조건부 요청을 한 번씩 보낸다. 실측으로 재방문 한 번에 **304가 26개,
# 7.9kB**다 (`.audit/wire.mjs` — 서버 쪽에서 나간 바이트를 센다). 바이트는
# 얼마 안 되지만 첫 그림이 뜨기 전에 왕복이 스물여섯 번 끼어든다.
#
# ⚠️ **`/assets/*`로 뭉뚱그리면 안 된다.** 그 폴더에는 Vite가 해시를 붙여 낸
# js·css와 **이름이 안 변하는 셸 그림 넷**(`radiant-platinum-*`)이 같이 산다.
# 그림에 1년 immutable을 걸면 그림을 고쳐도 이미 다녀간 사람에게는 1년 동안
# 옛 그림이 뜬다 — 되돌릴 방법이 없는 쪽이다.
#
# 그래서 **확장자로 가른다.** `/assets` 아래의 `.js`·`.css`는 예외 없이 Vite가
# 낸 것이고 이름에 내용 해시가 들어 있다 (`sw.js`와 매니페스트는 뿌리에 있고
# 그림은 `.png`·`.svg`·`.webp`다). 내용이 바뀌면 이름이 바뀌므로 영구 캐시가
# 안전하다. 그림 넷은 기본값 그대로 두어 언제든 갈아 끼울 수 있게 남긴다
[[headers]]
  for = "/assets/*.js"

  [headers.values]
    Cache-Control = "public,max-age=31536000,immutable"

[[headers]]
  for = "/assets/*.css"

  [headers.values]
    Cache-Control = "public,max-age=31536000,immutable"

# ── SPA fallback ─────────────────────────────────────────────────────────────
#
# 없는 경로는 `index.html`이다. 하네스가 띄우는 서버(`tools/e2e/serve.mjs`)도
# 같은 모양이라, 여기서 재는 것과 배포된 것이 같은 규칙 위에 선다
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
