<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/assets/mark.svg" />
    <!-- 홈 화면에 설치하면 전체화면으로 열린다. iOS Safari가 캔버스 전체화면을
         안 주는데(§12.2) 그 우회로이자, 7일 미사용 삭제의 면제 조건이다 (§4.6) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f1420" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/assets/mark-180.png" />
    <!-- ⚠️ 제목에 "Pokémon"을 앞세우지 않는다 (COPYRIGHT.md §11). 앞세우면 탭
         이름·홈 화면 아이콘·검색 결과가 전부 공식 제품처럼 읽힌다. 상표는
         권리자의 것이고 이 프로젝트는 비공식·비제휴다 -->
    <title>Radiant Platinum — 비공식 팬 프로젝트</title>
    <meta
      name="description"
      content="비공식·비제휴 팬 프로젝트입니다. 관련 상표와 저작물은 각 권리자의 것입니다.
        게임 자산은 사용자가 자기 기기에서 고른 입력으로 브라우저 안에서 만들며,
        서버는 원본도 변환 결과도 받지 않습니다."
    />
    <style>
      html, body, #root { margin: 0; height: 100%; overflow: hidden; }
      html { overscroll-behavior: none; }
      body { background: #0f1420; user-select: none; }
      #stage-wrap { touch-action: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
